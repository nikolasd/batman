# Each entry names one committed fixture file and the exact vendor
# invocation that reproduces it. Editing a prompt here is how you adapt
# capture to a CLI whose behavior changed.
#
# codex/schema-version.json is intentionally absent from this manifest.
# `crates/runtime/src/adapter/codex/schema.rs` owns its generation and live
# check through `codex app-server generate-json-schema` and
# `verify_against_installed_binary`.
#
# claude/result.jsonl is intentionally synthetic: it covers the
# error_max_turns/long-run edge case that a successful prompt cannot reproduce,
# so capture must not overwrite it.

claude:
  - fixture: initialize.jsonl
    prompt: "Read config.toml and tell me the read timeout value."
    startupOptions:
      permissionMode: default
  - fixture: subagent.jsonl
    prompt: "Use the Task tool to spawn one subagent that lists this directory."
    startupOptions:
      permissionMode: default
  - fixture: approval.jsonl
    prompt: "Run `ls` with bash."
    startupOptions:
      permissionMode: default

codex:
  - fixture: thread-turn.jsonl
    prompt: "Read config.toml and rewrite the read timeout to 45."
    startupOptions:
      sandboxMode: workspace-write
      approvalPolicy: on-request
  - fixture: approval.jsonl
    prompt: "Run `ls` with bash."
    startupOptions:
      approvalPolicy: on-request

copilot:
  - fixture: session-updates.jsonl
    prompt: "Read config.toml and edit the read timeout to 45."
  - fixture: permission.jsonl
    prompt: "Run `ls` in the terminal."
  - fixture: subagent.jsonl
    prompt: "Delegate listing this directory to a subagent."
  - fixture: initialize-v1.json
    handshakeOnly: true

ompRpc:
  - fixture: turn.jsonl
    model: "lm-studio/qwen2.5-coder-7b-instruct"
    prompt: "Rewrite config.toml so the read timeout is 45."
  - fixture: subagents.jsonl
    model: "lm-studio/qwen2.5-coder-7b-instruct"
    prompt: "Delegate listing this directory to a subagent."
