name: Build and Publish npm Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            leaf_target: darwin-arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            leaf_target: darwin-x64
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            leaf_target: linux-arm64-gnu
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            leaf_target: linux-x64-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build batcave
        run: cargo build --release --target ${{ matrix.rust_target }} --bin batcave

      - name: Assemble leaf package
        run: |
          cargo run -p batman-xtask -- package \
            --target ${{ matrix.leaf_target }} \
            --binary target/${{ matrix.rust_target }}/release/batcave

      - name: Upload leaf package
        uses: actions/upload-artifact@v4
        with:
          name: batman-${{ matrix.leaf_target }}
          path: packages/batman-${{ matrix.leaf_target }}/

  conformance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS workspace dependencies
        run: bun install
      - name: Run conformance unit tests
        run: bun test tests/conformance

      - name: Generate conformance report (STUB - will fail validation)
        run: |
          # STUB: Real implementation would spawn 'batcave conformance --adapter <name> --output <path>' for each adapter
          # For now, generate an empty report that will fail validation (intentional)
          echo '{"timestamp":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","adapters":{"claude":{"adapter":"claude","mode":"fixture","declaredCapabilities":[],"effectiveCapabilities":[],"scenarios":[]},"codex":{"adapter":"codex","mode":"fixture","declaredCapabilities":[],"effectiveCapabilities":[],"scenarios":[]},"copilot":{"adapter":"copilot","mode":"fixture","declaredCapabilities":[],"effectiveCapabilities":[],"scenarios":[]},"omp-rpc":{"adapter":"omp-rpc","mode":"fixture","declaredCapabilities":[],"effectiveCapabilities":[],"scenarios":[]}}}' > conformance-report.json

      - name: Validate conformance report (FAILS if stubs detected)
        run: bun run -e "import { loadAndValidateReport } from './tests/conformance/assert-report.ts'; loadAndValidateReport('conformance-report.json');"

  publish:
    needs: [build, conformance]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all leaf packages
        uses: actions/download-artifact@v4
        with:
          pattern: batman-*
          path: packages
          merge-multiple: false

      - name: Restore leaf package layout
        run: |
          # actions/download-artifact nests each artifact under
          # packages/<artifact-name>/, matching packages/batman-<target>/
          # already -- nothing further to reshape.
          ls -la packages/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install JS workspace dependencies
        run: bun install

      - name: Build the extension bundle
        # dist/ is gitignored and not produced by the build job (which only
        # compiles batcave); publishing packages/extension without this step
        # would ship a package missing dist/index.js, the file its own
        # "exports"/"omp.extensions" fields point at.
        run: bun run build

      - name: Publish leaf packages and extension to the private registry
        env:
          SATORI_NPM_TOKEN: ${{ secrets.SATORI_NPM_TOKEN }}
        run: |
          # Each package's own publishConfig.access (public for the 4 leaf
          # packages, restricted for the extension) governs visibility --
          # no --access flag here to avoid silently overriding it.
          for pkg in packages/batman-darwin-arm64 packages/batman-darwin-x64 \
                     packages/batman-linux-arm64-gnu packages/batman-linux-x64-gnu \
                     packages/extension; do
            (cd "$pkg" && bun publish)
          done
