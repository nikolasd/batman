name: Dry-Run Release Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read release/targets.json
        run: |
          MATRIX=$(jq -c '{include: [.targets[] | {os, rust_target: .rust, leaf_target: .leaf}]}' release/targets.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux ARM64 cross-compiler
        if: matrix.leaf_target == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc-aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build batcave
        run: cargo build --release --target ${{ matrix.rust_target }} --bin batcave

      - name: Assemble leaf package
        run: |
          cargo run -p batman-xtask -- package \
            --target ${{ matrix.leaf_target }} \
            --binary target/${{ matrix.rust_target }}/release/batcave
